<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hospital Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Dashboard</h1>
                <p>Overview of the hospital</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon">&#129489;</div>
                <div><div class="number" id="totalPatients">-</div><div class="label">Total Patients</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">&#129658;</div>
                <div><div class="number" id="totalDoctors">-</div><div class="label">Total Doctors</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">&#128197;</div>
                <div><div class="number" id="totalAppointments">-</div><div class="label">Total Appointments</div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Upcoming appointments</h2>
                <a class="btn btn-light btn-sm" href="appointments.html" style="text-decoration:none">View all</a>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Reason</th></tr>
                    </thead>
                    <tbody id="upcomingRows">
                    <tr><td colspan="5" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
