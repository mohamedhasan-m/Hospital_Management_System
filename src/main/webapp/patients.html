<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Hospital Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Patients</h1>
                <p>Add, edit and remove patient records</p>
            </div>
            <button class="btn btn-primary" id="addBtn">+ Add Patient</button>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>All patients</h2>
                <input type="search" class="search" id="search" placeholder="Search patients...">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Age</th><th>Gender</th>
                        <th>Phone</th><th>Address</th><th>Disease</th><th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="patientRows">
                    <tr><td colspan="8" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Popup form used for both Add and Edit -->
<dialog id="patientDialog">
    <form id="patientForm">
        <h2 id="dialogTitle">Add Patient</h2>
        <input type="hidden" name="id">
        <div class="form-grid">
            <div class="field full">
                <label for="name">Full name *</label>
                <input type="text" id="name" name="name" maxlength="100" required>
            </div>
            <div class="field">
                <label for="age">Age *</label>
                <input type="number" id="age" name="age" min="0" max="150" required>
            </div>
            <div class="field">
                <label for="gender">Gender *</label>
                <select id="gender" name="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="field full">
                <label for="phone">Phone (10 digits) *</label>
                <input type="text" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" required>
            </div>
            <div class="field full">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" maxlength="255">
            </div>
            <div class="field full">
                <label for="disease">Disease / problem</label>
                <input type="text" id="disease" name="disease" maxlength="255">
            </div>
        </div>
        <div class="dialog-actions">
            <button type="button" class="btn btn-light" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</dialog>

<script src="js/common.js"></script>
<script src="js/patients.js"></script>
</body>
</html>
