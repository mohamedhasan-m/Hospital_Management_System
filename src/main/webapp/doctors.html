<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Hospital Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Doctors</h1>
                <p>Add, edit and remove doctors</p>
            </div>
            <button class="btn btn-primary" id="addBtn">+ Add Doctor</button>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>All doctors</h2>
                <input type="search" class="search" id="search" placeholder="Search doctors...">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th>
                        <th>Email</th><th class="num">Fee (&#8377;)</th><th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="doctorRows">
                    <tr><td colspan="7" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Popup form used for both Add and Edit -->
<dialog id="doctorDialog">
    <form id="doctorForm">
        <h2 id="dialogTitle">Add Doctor</h2>
        <input type="hidden" name="id">
        <div class="form-grid">
            <div class="field full">
                <label for="name">Full name *</label>
                <input type="text" id="name" name="name" maxlength="100" required>
            </div>
            <div class="field full">
                <label for="specialization">Specialization *</label>
                <input type="text" id="specialization" name="specialization" maxlength="100"
                       placeholder="e.g. Cardiologist" required>
            </div>
            <div class="field">
                <label for="phone">Phone (10 digits) *</label>
                <input type="text" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" required>
            </div>
            <div class="field">
                <label for="fee">Consultation fee (&#8377;)</label>
                <input type="number" id="fee" name="fee" min="0" step="0.01" value="0">
            </div>
            <div class="field full">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" maxlength="100">
            </div>
        </div>
        <div class="dialog-actions">
            <button type="button" class="btn btn-light" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</dialog>

<script src="js/common.js"></script>
<script src="js/doctors.js"></script>
</body>
</html>
